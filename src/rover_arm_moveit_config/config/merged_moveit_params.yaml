move_group:
  ros__parameters:
    arm:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_attempts: 3
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.5
    arm_controller:
      action_ns: follow_joint_trajectory
      default: true
      joints:
      - j1_joint
      - j2_joint
      - j3_joint
      - ee_base_joint_x
      - ee_base_joint_y
      type: FollowJointTrajectory
    controller_names:
    - arm_controller
    joint_limits:
      j1_joint:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: false
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 50.0
        max_jerk: 0
        max_velocity: 1.0
      j2_joint:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: true
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 50.0
        max_jerk: 0
        max_position: 1.5708
        max_velocity: 1.0
        min_position: -1.5708
      j3_joint:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: true
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 50.0
        max_jerk: 0
        max_position: 1.5708
        max_velocity: 1.0
        min_position: -1.5708
      ee_base_joint_x:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: true
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 50.0
        max_jerk: 0
        max_position: 3.1416
        max_velocity: 1.0
        min_position: 0.0
      ee_base_joint_y:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: false
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 50.0
        max_jerk: 0
        max_velocity: 1.0
      slider_joint:
        has_acceleration_limits: false
        has_effort_limits: true
        has_jerk_limits: false
        has_position_limits: true
        has_velocity_limits: true
        max_acceleration: 0
        max_effort: 20.0
        max_jerk: 0
        max_position: 0.05
        max_velocity: 0.2
        min_position: 0.0
    ompl:
      arm:
        longest_valid_segment_fraction: 0.05
        planner_configs:
        - RRTConnectkConfigDefault
        - BKPIECEkConfigDefault
        - KPIECEkConfigDefault
        - RRTstarkConfigDefault
        - TRRTkConfigDefault
        projection_evaluator: joints(j1_joint,j2_joint)
      planner_configs:
        BKPIECEkConfigDefault:
          border_fraction: 0.9
          min_valid_path_fraction: 0.5
          range: 0.0
          type: geometric::BKPIECE
        KPIECEkConfigDefault:
          border_fraction: 0.9
          goal_bias: 0.05
          min_valid_path_fraction: 0.5
          range: 0.0
          type: geometric::KPIECE
        RRTConnectkConfigDefault:
          goal_bias: 0.05
          interpolate: false
          max_planning_time: 10.0
          range: 0.0
          type: geometric::RRTConnect
        RRTstarkConfigDefault:
          delay_collision_checking: 1
          goal_bias: 0.05
          range: 0.0
          type: geometric::RRTstar
        TRRTkConfigDefault:
          frountier_node_ratio: 0.1
          frountier_threshold: 0.0
          goal_bias: 0.05
          init_temperature: 10e-6
          k_constant: 0.0
          max_states_failed: 10
          min_temperature: 10e-10
          range: 0.0
          temp_change_factor: 2.0
          type: geometric::TRRT
      planning_plugin: ompl_interface/OMPLPlanner
      request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization default_planner_request_adapters/ResolveConstraintFrames
        default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds
        default_planner_request_adapters/FixStartStateCollision default_planner_request_adapters/FixStartStatePathConstraints
      start_state_max_bounds_error: 0.1
    planning_pipelines:
    - ompl
    publish_robot_description_semantic: true
    use_sim_time: false
