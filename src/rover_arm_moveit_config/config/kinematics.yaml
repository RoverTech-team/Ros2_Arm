arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  kinematics_solver_attempts: 3
  position_only_ik: true #c'è questa riga in piu rispetto al file di prima. Qua per facilitare il movimento perche non controlla l'orientazione dalla fine, però potrebbe essere una delle cause del motivo per cui arriva davanti al main switch e non lo vede bene. 

arm_chain:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  kinematics_solver_attempts: 3
  

